name: Samples CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [mvi-core, checkout-payments, bff-core, kmp-shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test ${{ matrix.module }}
        working-directory: samples/${{ matrix.module }}
        run: |
          if [ "${{ matrix.module }}" = "kmp-shared" ]; then gradle jvmTest --no-daemon; else gradle test --no-daemon; fi
